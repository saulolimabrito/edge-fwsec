name: Rocky Minimal lab

on:
  push:
    branches: [verify/x86-uefi]

permissions:
  contents: read

jobs:
  x86-uefi:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install VM tooling
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf xorriso cpio
      - name: Install Rocky Linux 10 Minimal offline and boot the guest
        run: bash tests/install/rocky-minimal-x86.sh "$RUNNER_TEMP/rocky-minimal"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rocky-minimal-x86-serial
          path: ${{ runner.temp }}/rocky-minimal/*.log
