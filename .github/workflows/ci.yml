name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: make check
      - run: make repro
      - name: netns topology (disposable runner)
        run: sudo EFW_TEST_VM=1 tests/topology/netns.sh up && sudo EFW_TEST_VM=1 tests/topology/netns.sh verify
      - name: policy traffic scenarios (disposable runner)
        run: |
          sudo apt-get install -y -q nftables
          make build
          sudo EFW_TEST_VM=1 tests/policy/scenarios.sh dist/local/efwctl internal/policy/testdata/edge.json tests/topology/netns.sh
      - name: agent lifecycle (disposable runner)
        run: sudo EFW_TEST_VM=1 tests/agent/lifecycle.sh dist/local internal/policy/testdata/edge.json tests/topology/netns.sh tests/policy/httpd.py
      - name: race detector
        run: CGO_ENABLED=1 go test -race -count=2 ./internal/...
      - uses: actions/upload-artifact@v4
        if: matrix.runner == 'ubuntu-24.04'
        with:
          name: linux-binaries
          path: |
            dist/linux-*/
            dist/SHA256SUMS
          if-no-files-found: error

  rocky10:
    name: go tests on Rocky Linux 10 (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container:
      image: docker.io/rockylinux/rockylinux:10
      # The image declares no PATH; without this, setup-go's GITHUB_PATH
      # entry becomes the whole PATH and later steps cannot find sh.
      env:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - run: dnf -y install git tar gzip make
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - run: cat /etc/rocky-release && go test -count=1 ./...
