name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: make check
      - run: make repro
      - name: netns topology (disposable runner)
        run: sudo EFW_TEST_VM=1 tests/topology/netns.sh up && sudo EFW_TEST_VM=1 tests/topology/netns.sh verify
      - uses: actions/upload-artifact@v4
        if: matrix.runner == 'ubuntu-24.04'
        with:
          name: linux-binaries
          path: |
            dist/linux-*/
            dist/SHA256SUMS
          if-no-files-found: error

  rocky10:
    name: go tests on Rocky Linux 10 (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: docker.io/rockylinux/rockylinux:10
    steps:
      - run: dnf -y install git tar gzip make
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - run: cat /etc/rocky-release && go test -count=1 ./...
